<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recipe Search</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
          <link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='icon.png') }}">

<link
    rel="manifest"
    href="{{ url_for('static', filename='manifest.json') }}">
    <meta
    name="theme-color"
    content="#4CAF50">

<meta
    name="mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

<meta
    name="apple-mobile-web-app-title"
    content="PlanMyPlate">
</head>

<body>

    <div class="navbar">

    <a href="/dashboard" class="logo">
        PlanMyPlate 🍽️
    </a>

</div>

    <div class="hero">

        <div class="recipe-card">

            <h1>
                AI Recipe Search 🔍🍲
            </h1>

            <form method="GET">

                <div style="position: relative;">

    <input
        type="text"
        id="recipe-search-input"
        name="recipe"
        placeholder="Search recipe..."
        value="{{ recipe_name or '' }}"
        autocomplete="off"
        onkeyup="showRecipeSearchSuggestions()">

    <div
        id="recipe-search-suggestions"
        class="suggestions-box">
    </div>

</div>

                <br><br>

                <button class="btn">

                    Search Recipe 🔍

                </button>

            </form>

        </div>

        {% if result %}
        <div class="recipe-card">
    <img
        class="recipe-image"
        src="{{ recipe_image_url }}"
        alt="{{ recipe_name }}">
</div>
        <div class="recipe-card">

            <h2>
                AI Generated Recipe ✨
            </h2>

            <pre class="recipe-text">
{{ result }}
            </pre>

            <form action="/save_nutrition_recipe"
                  method="POST">

                <input
    type="text"
    name="title"
    placeholder="Enter recipe name..."
    value="{{ recipe_name }}"
    required>

                <input
                    type="hidden"
                    name="ingredients"
                    value="{{ recipe_name }}">

                <input
                    type="hidden"
                    name="instructions"
                    value="{{ result }}">

                <button class="btn">

                    Save To Favorites ❤️

                </button>

            </form>

        </div>

        {% endif %}

    </div>
<script>

const recipeSuggestions = [

    // Biryani
    "Chicken Biryani",
    "Hyderabadi Biryani",
    "Veg Biryani",

    // Rice
    "Fried Rice",
    "Chicken Fried Rice",
    "Veg Fried Rice",
    "Jeera Rice",
    "Pulao",

    // Pasta & Noodles
    "White Sauce Pasta",
    "Red Sauce Pasta",
    "Noodles",
    "Ramen",
    "Maggi",

    // Pizza & Burgers
    "Pizza",
    "Burger",
    "Cheese Burger",
    "Veg Burger",

    // South Indian
    "Masala Dosa",
    "Plain Dosa",
    "Idli",
    "Medu Vada",
    "Upma",
    "Poha",

    // Indian Main Course
    "Butter Chicken",
    "Chicken Curry",
    "Paneer Butter Masala",
    "Palak Paneer",
    "Dal",
    "Rajma",
    "Chole",
    "Bhindi Fry",
    "Aloo Gobi",
    "Khichdi",

    // Bread
    "Naan",
    "Roti",
    "Paratha",

    // Snacks
    "Samosa",
    "Pakora",
    "Spring Roll",
    "Momos",
    "French Fries",
    "Chicken Nuggets",
    "Shawarma",
    "Frankie",
    "Kebab",

    // Street Food
    "Pani Puri",
    "Bhel Puri",
    "Sev Puri",
    "Pav Bhaji",
    "Dhokla",
    "Chaat",

    // Wraps
    "Wrap",
    "Burrito",
    "Tacos",

    // Soups & Salads
    "Tomato Soup",
    "Chicken Soup",
    "Salad",

    // Egg Recipes
    "Omelette",
    "Boiled Egg",
    "Egg Curry",

    // Fish
    "Fish Curry",
    "Fried Fish",

    // Desserts
    "Cake",
    "Brownie",
    "Cookies",
    "Donut",
    "Ice Cream",
    "Gulab Jamun",
    "Rasmalai",
    "Jalebi",

    // Breakfast
    "Pancake",
    "Waffle",
    "Croissant",
    "Sandwich",

    // Drinks
    "Tea",
    "Coffee",
    "Lassi",
    "Milkshake",
    "Mango Shake",
    "Oreo Shake",
    "Smoothie",
    "Mojito",
    "Mocktail",
    "Juice",
    "Falooda",

    // International
    "Lasagna",
    "Sushi",
    "Dumplings",
    "Falafel",
    "Steak",
    "Grilled Chicken",
    "Tandoori Chicken",
    "Hot Dog"
];

function showRecipeSearchSuggestions() {

    const input =
        document.getElementById(
            "recipe-search-input"
        );

    const box =
        document.getElementById(
            "recipe-search-suggestions"
        );

    const value =
        input.value.toLowerCase();

    box.innerHTML = "";

    if (value.length === 0) {

        box.style.display = "none";
        return;
    }

    const filtered =
        recipeSuggestions.filter(recipe =>

            recipe.toLowerCase()
            .includes(value)
        );

    if (filtered.length > 0) {

        box.style.display = "block";

    } else {

        box.style.display = "none";
    }

    filtered.forEach(recipe => {

        const div =
            document.createElement("div");

        div.classList.add("suggestion-item");

        div.innerText = recipe;

        div.onclick = function() {

            input.value = recipe;

            box.style.display = "none";
        };

        box.appendChild(div);
    });
}

</script>
<script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/static/service-worker.js"
    );
}

</script>
</body>
</html>
