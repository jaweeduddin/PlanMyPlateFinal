function showSuggestions() {

    const input =
        document.getElementById("ingredients");

    const box =
        document.getElementById("suggestions-box");

    const words =
    input.value.toLowerCase().split(",");

const value =
    words[words.length - 1].trim();

    box.innerHTML = "";

    if (value.length === 0) {

        return;
    }

    const filtered =
        ingredientsList.filter(item =>
            item.startsWith(value)
        );

    filtered.forEach(item => {

        const div =
            document.createElement("div");

        div.classList.add("suggestion-item");

        div.innerText = item;

        div.onclick = function() {

    words[words.length - 1] = " " + item;

    input.value = words.join(",");

    box.innerHTML = "";
};

        box.appendChild(div);
    });
}
function startVoice() {

    if (!('webkitSpeechRecognition' in window)) {

        alert("Voice recognition not supported.");

        return;
    }

    const recognition = new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        document.getElementById("ingredients").value =
            transcript;
    };
}

</script>

let uncheckedIngredients = [];

let currentAlternativeIndex = 0;

function openPopup() {

    const ingredients =
        document.getElementById(
            "ingredients"
        ).value;

    if (ingredients.trim() === "") {

        alert(
            "Please enter ingredients first."
        );

        return;
    }

    document.getElementById(
        "servings-popup"
    ).style.display = "flex";
}
function continueToIngredients() {

    const selected =
        document.querySelector(
            'input[name="serving_option"]:checked'
        );

    let servings = selected.value;
    document.getElementById(
    "servings"
).value = servings;
    if (servings === "custom") {

        servings =
            document.getElementById(
                "custom-servings"
            ).value;
         document.getElementById(
        "servings"
    ).value = servings;
        if (!servings) {

            alert(
                "Please enter servings"
            );

            return;
        }
    }

    document.getElementById(
        "servings-popup"
    ).style.display = "none";
    alert(
    "Selected servings = " +
    document.getElementById("servings").value
);
    openIngredientPopup();
}
async function openIngredientPopup() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    
    const ingredients =
        document.getElementById(
            "ingredients"
        ).value;

    if (ingredients.trim() === "") {

        alert(
            "Please enter ingredients first."
        );

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "ingredients",
        ingredients
    );

    const response =
        await fetch(
            "/predict_ingredients",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    const ingredientList =
    data.ingredients
    .trim()
    .split("\n");

    const container =
        document.getElementById(
            "checkbox-container"
        );

    container.innerHTML = "";

    ingredientList.forEach(item => {

        item = item.trim();

        if (item === "")
            return;

        const label =
            document.createElement(
                "label"
            );

        label.classList.add(
            "ingredient-item"
        );

        label.innerHTML = `
            <input
                type="checkbox"
                value="${item}"
                checked>

            ${item}
        `;

        container.appendChild(
            label
        );
    });

    document.getElementById(
        "ingredient-popup"
    ).style.display = "flex";
}

function submitRecipeForm() {

    uncheckedIngredients = [];

    selectedAlternatives = [];

    currentAlternativeIndex = 0;

    const allCheckboxes =
        document.querySelectorAll(
            '#checkbox-container input'
        );

    let selected = [];

    allCheckboxes.forEach(box => {

        if (box.checked) {

            selected.push(box.value);

        } else {

            const ingredient =
                box.value.toLowerCase();

            if (
                ingredientAlternatives[
                    ingredient
                ]
            ) {

                uncheckedIngredients.push(
                    ingredient
                );

                fetch(
    "/save_missing_ingredient",
    {

        method: "POST",

        headers: {

            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            ingredient: ingredient
        })
    }
);
            }
        }
    });

    const ingredientsBox =
        document.getElementById(
            "ingredients"
        );

    ingredientsBox.value +=
        ", " + selected.join(", ");

    if (
        uncheckedIngredients.length > 0
    ) {

        showAlternativePopup();

    } else {

        document.getElementById(
            "recipe-form"
        ).submit();
    }
}

function showAlternativePopup() {
window.scrollTo({

    top: 0,

    behavior: "smooth"
});
    const ingredient =
        uncheckedIngredients[
            currentAlternativeIndex
        ];

    const alternatives =
        ingredientAlternatives[
            ingredient
        ];

    let optionsHTML = "";

    alternatives.forEach(item => {

        optionsHTML += `
            <label class="ingredient-item">

                <input
                    type="radio"
                    name="alternative"
                    value="${item}"
                    ${item === alternatives[0] ? "checked" : ""}>

                ${item}

            </label>
        `;
    });

    document.body.insertAdjacentHTML(
        "beforeend",

        `
        <div
            id="alternative-popup"
            class="popup-overlay"
            style="display:flex;">

            <div class="popup-box">

                <h2>
                    Alternative for
                    ${ingredient} 🔄
                </h2>

                <p>
                    Select available substitute
                </p>

                <div
                    id="alternative-options"
                    style="
                        display:grid;
                        grid-template-columns:
                        repeat(2,1fr);
                        gap:15px;
                        margin-top:20px;
                    ">

                    ${optionsHTML}

                </div>

                <br>

                <button
                    class="btn"
                    onclick="saveAlternative()">

                    Continue ➜

                </button>

            </div>

        </div>
        `
    );
}

function saveAlternative() {

    const selected =
        document.querySelector(
            'input[name="alternative"]:checked'
        );

    if (selected) {

        selectedAlternatives.push(
            selected.value
        );
    }

    document.getElementById(
        "alternative-popup"
    ).remove();

    currentAlternativeIndex++;

    if (
        currentAlternativeIndex <
        uncheckedIngredients.length
    ) {

        showAlternativePopup();

    } else {

        const ingredientsBox =
            document.getElementById(
                "ingredients"
            );

        ingredientsBox.value +=
            ", " +
            selectedAlternatives.join(", ");

        document.getElementById(
            "recipe-form"
        ).submit();
    }
}
document.addEventListener(
    "change",
    function(e) {

        if (
            e.target.name ===
            "serving_option"
        ) {

            document.getElementById(
                "custom-servings"
            ).style.display =

            e.target.value === "custom"
            ? "block"
            : "none";

);
