<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

          <link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='icon.png') }}">

<meta
    name="theme-color"
    content="#4CAF50">
</head>

<body>

    <div class="navbar">

    <div class="logo">
        PlanMyPlate 🍽️
    </div>

    <a href="/dashboard"
       class="nav-home-btn">

        🏠 Dashboard

    </a>

</div>

    <div class="hero">

        <div class="recipe-card">

            <h1>Create Account ✨</h1>

            <form method="POST">

                <input type="text"
                       name="username"
                       placeholder="Enter Username">

                <br><br>

                <input type="email"
                       name="email"
                       placeholder="Enter Email">

                <br><br>

                <input type="password"
                       name="password"
                       placeholder="Enter Password">

                <br><br>

                <button class="btn">
                    Register
                </button>

            </form>

            <p>
                Already have account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
