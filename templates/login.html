<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="navbar">

    <div class="logo">
        PlanMyPlate 🍽️
    </div>

    <a href="/dashboard"
       class="nav-home-btn">

        🏠 Dashboard

    </a>

</div>

    <div class="hero">

        <div class="recipe-card">

            <h1>Welcome Back 👋</h1>

            <form method="POST">

                <input type="email"
                       name="email"
                       placeholder="Enter Email">

                <br><br>

                <input type="password"
                       name="password"
                       placeholder="Enter Password">

                <br><br>

                <button class="btn">
                    Login
                </button>

            </form>

            <p>
                Don't have account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</body>
</html>
