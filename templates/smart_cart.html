<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>
        Smart Cart
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}">

</head>

<body>

<div class="navbar">

    <a href="/dashboard"
       class="logo">

        PlanMyPlate 🍽️

    </a>

</div>

<div class="hero">

    <h1 class="smart-cart-title">

    Smart Cart 🛒

</h1>

    {% if items %}

        {% for item in items %}

        

    

            <div class="smart-cart-card">

    <div class="smart-cart-item">

        <div class="smart-cart-emoji">

            {{ item.emoji }}

        </div>

        <div class="smart-cart-name">

            {{ item.ingredient }}

        </div>

    </div>

    <a
        href="/remove_smart_cart/{{ item.id }}"
        class="smart-cart-btn">

        I Have This ✅

    </a>

</div>

        {% endfor %}

    {% else %}

        <div class="recipe-card">

            <h2>
                Your Smart Cart is Empty 😄
            </h2>

        </div>

    {% endif %}

</div>

</body>
</html>
